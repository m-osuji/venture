stages:
  - test

test:
  stage: test
  image: python:3.13
  cache:
    paths:
      - venv/
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install -r requirements.txt
  script:
    - python -m pytest backend/tests/ -m "not slow" -v --cov=backend --cov-report=term-missing
  coverage: '/TOTAL.*\s+(\d+%)$/'
  only:
    - merge_requests
    - main